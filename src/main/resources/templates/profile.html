<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Người Dùng - JWT Authentication</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 20px;
        }
        .profile-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            position: relative;
        }
        .profile-banner {
            height: 120px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            position: relative;
        }
        .avatar-container {
            width: 110px;
            height: 110px;
            margin: -55px auto 15px;
            position: relative;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #1e293b;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            background-color: #0f172a;
        }
        .info-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f8fafc;
            word-break: break-all;
        }
        .badge-active {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .btn-logout {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }
        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div id="profileContainer" class="profile-card d-none">
    <div class="profile-banner"></div>
    
    <div class="avatar-container">
        <img id="userAvatar" src="" alt="Avatar" class="avatar-img">
    </div>

    <div class="px-4 pb-4 text-center">
        <h3 id="userFullName" class="fw-bold mb-1">...</h3>
        <span class="badge badge-active mb-4"><i class="fa-solid fa-circle-check me-1"></i> Đã Xác Thực JWT</span>

        <div class="text-start mt-2">
            <div class="info-box">
                <div class="info-label"><i class="fa-solid fa-hashtag me-2"></i>Mã User ID</div>
                <div id="userId" class="info-value">...</div>
            </div>

            <div class="info-box">
                <div class="info-label"><i class="fa-solid fa-envelope me-2"></i>Địa Chỉ Email</div>
                <div id="userEmail" class="info-value">...</div>
            </div>

            <div class="info-box">
                <div class="info-label"><i class="fa-solid fa-calendar-alt me-2"></i>Ngày Tạo Tài Khoản</div>
                <div id="userCreatedAt" class="info-value">...</div>
            </div>
        </div>

        <div class="mt-4">
            <button id="logoutBtn" class="btn btn-logout w-100">
                <i class="fa-solid fa-right-from-bracket me-2"></i> ĐĂNG XUẤT HỆ THỐNG
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Main Application JS -->
<script th:src="@{/js/mainjs.js}" src="/js/mainjs.js"></script>
</body>
</html>
