server.port=8005
spring.application.name=JWT_springboot3

# Cấu hình SQLite (tạo file jwt_springboot3.db tại thư mục gốc dự án)
spring.datasource.url=jdbc:sqlite:jwt_springboot3.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate & JPA cho SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cấu hình bảo mật JWT
# Secret key 256 bits (HMAC-SHA256)
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# Thời hạn token: 1 giờ = 3600000 ms
security.jwt.expiration-time=3600000
